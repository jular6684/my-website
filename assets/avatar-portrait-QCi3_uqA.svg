<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="about-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="45%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <radialGradient id="cyber-glow-blue" cx="30%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyber-glow-pink" cx="75%" cy="75%" r="60%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Face & Lighting Gradients -->
    <linearGradient id="face-grad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#fce7f3" />
      <stop offset="40%" stop-color="#fbcfe8" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <linearGradient id="hair-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="jacket-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="neon-rim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="640" height="800" fill="url(#about-bg-grad)" />
  <rect width="640" height="800" fill="url(#cyber-glow-blue)" />
  <rect width="640" height="800" fill="url(#cyber-glow-pink)" />

  <!-- Architectural Background Grid -->
  <g stroke="#334155" stroke-width="0.5" stroke-opacity="0.2">
    <line x1="0" y1="160" x2="640" y2="160" />
    <line x1="0" y1="320" x2="640" y2="320" />
    <line x1="0" y1="480" x2="640" y2="480" />
    <line x1="0" y1="640" x2="640" y2="640" />
    <line x1="160" y1="0" x2="160" y2="800" />
    <line x1="320" y1="0" x2="320" y2="800" />
    <line x1="480" y1="0" x2="480" y2="800" />
  </g>

  <!-- Outer Floating Cyber Halo -->
  <circle cx="320" cy="350" r="230" fill="none" stroke="url(#neon-rim)" stroke-width="1.5" stroke-dasharray="6,8" opacity="0.6" />
  <circle cx="320" cy="350" r="260" fill="none" stroke="#6366f1" stroke-width="0.8" opacity="0.3" />

  <!-- Shoulders & Tech Jacket -->
  <path d="M 120 760 Q 220 540, 320 540 Q 420 540, 520 760 Z" fill="url(#jacket-grad)" stroke="#334155" stroke-width="1" />
  <!-- Jacket Collar & Tech Seams -->
  <path d="M 240 540 L 290 660 L 320 720 L 350 660 L 400 540" fill="#0f172a" stroke="#475569" stroke-width="1.5" />
  <line x1="320" y1="540" x2="320" y2="760" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,4" opacity="0.7" />

  <!-- Inner Shirt / Turtleneck -->
  <path d="M 270 510 Q 320 535, 370 510 L 370 570 Q 320 590, 270 570 Z" fill="#020617" />

  <!-- Neck -->
  <path d="M 275 390 L 275 520 Q 320 545, 365 520 L 365 390 Z" fill="#fbcfe8" />
  <!-- Shadow on Neck -->
  <path d="M 275 420 Q 320 460, 365 420 L 365 390 L 275 390 Z" fill="#e0e7ff" opacity="0.4" />

  <!-- Head Base / Handsome Jawline -->
  <path d="M 210 270 Q 200 390, 320 440 Q 440 390, 430 270 Q 430 150, 320 150 Q 210 150, 210 270 Z" fill="url(#face-grad)" />

  <!-- Stylish Modern Hair -->
  <!-- Back / Volume -->
  <path d="M 185 240 Q 180 120, 320 100 Q 460 120, 455 240 Q 450 160, 410 125 Q 320 90, 220 125 Q 190 160, 185 240 Z" fill="url(#hair-grad)" />
  <!-- Forehead Bangs & Layers -->
  <path d="M 195 210 Q 250 140, 340 135 Q 430 140, 435 210 Q 400 170, 350 175 Q 310 180, 280 170 Q 230 180, 195 210 Z" fill="#0f172a" />
  <path d="M 220 180 Q 260 145, 310 140 Q 330 170, 310 200 Q 270 180, 220 180 Z" fill="#1e1b4b" opacity="0.9" />

  <!-- Ears -->
  <ellipse cx="205" cy="290" rx="14" ry="24" fill="#fbcfe8" />
  <ellipse cx="435" cy="290" rx="14" ry="24" fill="#fbcfe8" />

  <!-- Eyebrows -->
  <path d="M 240 240 Q 270 232, 295 240" fill="none" stroke="#1e1b4b" stroke-width="4" stroke-linecap="round" />
  <path d="M 345 240 Q 370 232, 400 240" fill="none" stroke="#1e1b4b" stroke-width="4" stroke-linecap="round" />

  <!-- Eyes -->
  <ellipse cx="268" cy="265" rx="14" ry="9" fill="#ffffff" />
  <circle cx="270" cy="265" r="6" fill="#0f172a" />
  <circle cx="272" cy="263" r="2" fill="#38bdf8" />

  <ellipse cx="372" cy="265" rx="14" ry="9" fill="#ffffff" />
  <circle cx="370" cy="265" r="6" fill="#0f172a" />
  <circle cx="372" cy="263" r="2" fill="#38bdf8" />

  <!-- Tech Architect Glasses (Minimalist Rimless Titanium Frame) -->
  <rect x="242" y="248" width="56" height="34" rx="8" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" stroke-width="1.8" />
  <rect x="342" y="248" width="56" height="34" rx="8" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" stroke-width="1.8" />
  <!-- Bridge -->
  <path d="M 298 262 Q 320 258, 342 262" fill="none" stroke="#818cf8" stroke-width="2" />
  <!-- Temples -->
  <line x1="242" y1="262" x2="202" y2="258" stroke="#38bdf8" stroke-width="1.5" />
  <line x1="398" y1="262" x2="438" y2="258" stroke="#38bdf8" stroke-width="1.5" />

  <!-- Nose -->
  <path d="M 320 262 L 314 315 L 326 318" fill="none" stroke="#e0e7ff" stroke-width="2" stroke-linecap="round" />

  <!-- Confident Smile -->
  <path d="M 292 355 Q 320 375, 348 355" fill="none" stroke="#db2777" stroke-width="2.5" stroke-linecap="round" />

  <!-- Cybernetic HUD Code Badges (Bottom Floating Tag) -->
  <g transform="translate(140, 710)">
    <rect width="360" height="48" rx="12" fill="#090d16" fill-opacity="0.85" stroke="url(#neon-rim)" stroke-width="1.5" />
    <circle cx="24" cy="24" r="5" fill="#10b981" />
    <text x="38" y="29" fill="#f8fafc" font-family="monospace" font-size="13" font-weight="bold">Liang Zhou · AI Architect</text>
    <text x="250" y="28" fill="#a5b4fc" font-family="monospace" font-size="11">Normed Space</text>
  </g>
</svg>
