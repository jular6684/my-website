<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg1)" />
  <!-- Grid Matrix -->
  <g stroke="#334155" stroke-width="0.5" stroke-opacity="0.3">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>
  <!-- Node Card Layout -->
  <rect x="80" y="60" width="640" height="330" rx="16" fill="#1e293b" fill-opacity="0.6" stroke="url(#cyan-grad)" stroke-width="1.5" />
  <!-- Window Header -->
  <circle cx="110" cy="90" r="5" fill="#ef4444" />
  <circle cx="130" cy="90" r="5" fill="#f59e0b" />
  <circle cx="150" cy="90" r="5" fill="#10b981" />
  <rect x="180" y="80" width="200" height="20" rx="6" fill="#334155" fill-opacity="0.5" />
  <!-- Workflow Nodes -->
  <rect x="120" y="140" width="140" height="70" rx="10" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" />
  <text x="140" y="170" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">Proposal Spec</text>
  <text x="140" y="190" fill="#94a3b8" font-family="monospace" font-size="10">contract: valid</text>

  <path d="M 260 175 L 340 175" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" />
  
  <rect x="340" y="130" width="160" height="90" rx="12" fill="#0f172a" stroke="#818cf8" stroke-width="2" filter="url(#glow1)" />
  <text x="360" y="165" fill="#a5b4fc" font-family="monospace" font-size="13" font-weight="bold">AI Agent Engine</text>
  <text x="360" y="185" fill="#34d399" font-family="monospace" font-size="10">● Autonomous Loop</text>
  <text x="360" y="202" fill="#94a3b8" font-family="monospace" font-size="9">3D Verification [PASS]</text>

  <path d="M 500 175 L 570 175" stroke="#818cf8" stroke-width="2" stroke-dasharray="4,4" />

  <rect x="570" y="140" width="130" height="70" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" />
  <text x="590" y="170" fill="#c084fc" font-family="monospace" font-size="12" font-weight="bold">Verified App</text>
  <text x="590" y="190" fill="#94a3b8" font-family="monospace" font-size="10">build: success</text>

  <!-- Metrics Graph at bottom -->
  <rect x="120" y="250" width="560" height="110" rx="10" fill="#0b1329" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
  <path d="M 140 330 Q 220 280, 300 310 T 460 270 T 660 260" fill="none" stroke="url(#cyan-grad)" stroke-width="3" />
  <text x="140" y="275" fill="#64748b" font-family="sans-serif" font-size="11" font-weight="600">CYCLE EFFICIENCY &amp; SPEC FIDELITY (99.8%)</text>
</svg>
