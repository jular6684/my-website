<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="ide-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#2e1065" />
    </linearGradient>
    <linearGradient id="purple-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#ide-bg)" />
  <!-- IDE Outer Frame -->
  <rect x="70" y="50" width="660" height="350" rx="14" fill="#0f172a" stroke="url(#purple-pink)" stroke-width="1.5" />
  <!-- Title bar -->
  <rect x="70" y="50" width="660" height="40" rx="14" fill="#1e1b4b" fill-opacity="0.7" />
  <circle cx="95" cy="70" r="5" fill="#f43f5e" />
  <circle cx="115" cy="70" r="5" fill="#fbbf24" />
  <circle cx="135" cy="70" r="5" fill="#10b981" />
  <text x="320" y="74" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">Antigravity Next IDE — Workspace</text>
  
  <!-- Left File Tree -->
  <rect x="70" y="90" width="160" height="310" fill="#0b0f19" fill-opacity="0.8" />
  <text x="90" y="120" fill="#64748b" font-family="monospace" font-size="11">EXPLORER</text>
  <text x="100" y="145" fill="#a5b4fc" font-family="monospace" font-size="11">▸ src/agent</text>
  <text x="110" y="170" fill="#38bdf8" font-family="monospace" font-size="11">  planner.rs</text>
  <text x="110" y="195" fill="#38bdf8" font-family="monospace" font-size="11">  executor.rs</text>
  <text x="100" y="220" fill="#a5b4fc" font-family="monospace" font-size="11">▸ protocols</text>
  <text x="110" y="245" fill="#c084fc" font-family="monospace" font-size="11">  mcp_host.ts</text>

  <!-- Editor Pane -->
  <rect x="230" y="90" width="310" height="310" fill="#0f172a" />
  <text x="250" y="125" fill="#ec4899" font-family="monospace" font-size="12">pub async fn</text>
  <text x="345" y="125" fill="#38bdf8" font-family="monospace" font-size="12">dispatch_task</text>
  <text x="250" y="150" fill="#94a3b8" font-family="monospace" font-size="11">// Autonomous tool synthesis</text>
  <text x="250" y="175" fill="#e2e8f0" font-family="monospace" font-size="11">let agent = Agent::spawn().await;</text>
  <text x="250" y="200" fill="#10b981" font-family="monospace" font-size="11">+ agent.verify_state(spec).ok();</text>
  <text x="250" y="225" fill="#e2e8f0" font-family="monospace" font-size="11">agent.commit_stream().await</text>

  <!-- Sidecar Assistant Panel -->
  <rect x="540" y="90" width="190" height="310" fill="#1e1b4b" fill-opacity="0.4" stroke-left="#334155" />
  <rect x="555" y="110" width="160" height="90" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1" />
  <text x="565" y="130" fill="#c084fc" font-family="sans-serif" font-size="10" font-weight="bold">AI Copilot State</text>
  <text x="565" y="150" fill="#34d399" font-family="sans-serif" font-size="10">● Ready to Apply</text>
  <text x="565" y="175" fill="#94a3b8" font-family="sans-serif" font-size="9">Latency: 12ms (Rust MCP)</text>

  <rect x="555" y="220" width="160" height="150" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="565" y="245" fill="#38bdf8" font-family="monospace" font-size="10">$ mcp inspect</text>
  <text x="565" y="270" fill="#e2e8f0" font-family="monospace" font-size="9">Active tools: 18</text>
  <text x="565" y="290" fill="#10b981" font-family="monospace" font-size="9">Pipeline: Clean</text>
</svg>
