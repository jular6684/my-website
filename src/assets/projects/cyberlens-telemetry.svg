<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="cyber-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180e05" />
      <stop offset="50%" stop-color="#2a1405" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <linearGradient id="amber-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#cyber-bg)" />
  <!-- Telemetry Dashboard Container -->
  <rect x="70" y="50" width="660" height="350" rx="14" fill="#1c1917" fill-opacity="0.9" stroke="url(#amber-orange)" stroke-width="1.5" />
  <!-- Header -->
  <text x="100" y="90" fill="#fbbf24" font-family="monospace" font-size="15" font-weight="bold">CYBERLENS WEBGL TELEMETRY</text>
  <circle cx="680" cy="85" r="5" fill="#22c55e" />
  <text x="692" y="89" fill="#86efac" font-family="sans-serif" font-size="11">LIVE 120 FPS</text>

  <!-- Metric Badges -->
  <rect x="100" y="115" width="150" height="65" rx="8" fill="#292524" stroke="#44403c" stroke-width="1" />
  <text x="115" y="138" fill="#a8a29e" font-family="sans-serif" font-size="10">RENDER TIME</text>
  <text x="115" y="165" fill="#fde047" font-family="monospace" font-size="20" font-weight="bold">1.24 ms</text>

  <rect x="270" y="115" width="150" height="65" rx="8" fill="#292524" stroke="#44403c" stroke-width="1" />
  <text x="285" y="138" fill="#a8a29e" font-family="sans-serif" font-size="10">EVENT THROUGHPUT</text>
  <text x="285" y="165" fill="#fb923c" font-family="monospace" font-size="20" font-weight="bold">52.8k/s</text>

  <rect x="440" y="115" width="250" height="65" rx="8" fill="#292524" stroke="#44403c" stroke-width="1" />
  <text x="455" y="138" fill="#a8a29e" font-family="sans-serif" font-size="10">GPU MEMORY OCCUPATION</text>
  <text x="455" y="165" fill="#38bdf8" font-family="monospace" font-size="20" font-weight="bold">42.6 MB (Clean)</text>

  <!-- Waveform / Chart Area -->
  <rect x="100" y="200" width="600" height="170" rx="10" fill="#0c0a09" stroke="#44403c" stroke-width="1" />
  <!-- Grid lines -->
  <line x1="100" y1="240" x2="700" y2="240" stroke="#292524" stroke-width="1" stroke-dasharray="2,2" />
  <line x1="100" y1="280" x2="700" y2="280" stroke="#292524" stroke-width="1" stroke-dasharray="2,2" />
  <line x1="100" y1="320" x2="700" y2="320" stroke="#292524" stroke-width="1" stroke-dasharray="2,2" />
  
  <!-- Waveform Curves -->
  <path d="M 100 320 C 180 250, 240 330, 320 230 C 400 310, 480 220, 560 270 C 620 210, 660 250, 700 230" fill="none" stroke="url(#amber-orange)" stroke-width="3" />
  <path d="M 100 340 C 180 300, 240 350, 320 280 C 400 340, 480 290, 560 320 C 620 270, 660 300, 700 280" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-opacity="0.6" />
</svg>
